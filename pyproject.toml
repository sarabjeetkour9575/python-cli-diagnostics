[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-cli-diagnostics"
version = "1.0.0"
description = "A command-line tool for basic system diagnostics"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
diagnostics = "main:main"

[tool.setuptools]
py-modules = ["main"]
