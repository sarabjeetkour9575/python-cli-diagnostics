name: Python CLI Diagnostics Tests

on:
push:
branches: [main]
pull_request:
branches: [main]
workflow_dispatch:

jobs:
test:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Python
     uses: actions/setup-python@v5
     with:
       python-version: "3.12"

  - name: Run unit tests
    run: python -m unittest -v
test_diagnostics.py

  - name: Run CLI diagnostics
    run: python main.py

  - name: Install package
    run: python -m pip install .

  - name: Test installed command
    run: diagnostics
