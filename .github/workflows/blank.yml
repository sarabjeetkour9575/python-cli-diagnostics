name: Python CLI Diagnostics Tests

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

  - name: Run unit tests
    run: python -m unittest -v
  test_diagnostics.py

  - name: Run CLI diagnostics
    run: python main.py

  - name: Install package
    run: python -m pip install .

  - name: Test installed command
    run: diagnostics
